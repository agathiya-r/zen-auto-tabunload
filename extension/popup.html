<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Zen Idle Unloader</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main><span class="eyebrow">ZEN IDLE UNLOADER</span><h1>Keep the tab.<br>Free the memory.</h1>
